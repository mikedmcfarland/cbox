; cbox base supervisord program definitions.
;
; Loaded via /etc/supervisor/supervisord.conf -> include /etc/supervisor/conf.d/*.conf.
; Two long-running services: dockerd (DinD) and sshd. Both restart on
; failure; logs go to stdout/stderr so `docker logs` works.

[program:dockerd]
command=/usr/bin/dockerd --config-file=/etc/docker/daemon.json
autostart=true
autorestart=true
startretries=5
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:sshd]
command=/usr/sbin/sshd -D -e
autostart=true
autorestart=true
startretries=5
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
