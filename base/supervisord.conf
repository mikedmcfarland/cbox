; cbox base supervisord program definitions.
;
; Loaded via /etc/supervisor/supervisord.conf -> include /etc/supervisor/conf.d/*.conf.
; Two long-running services: dockerd (DinD) and sshd. Both restart on
; failure; logs go to stdout/stderr so `docker logs` works.

[program:dockerd]
command=/usr/bin/dockerd --config-file=/etc/docker/daemon.json
autostart=true
autorestart=true
startretries=5
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:sshd]
command=/usr/sbin/sshd -D -e
autostart=true
autorestart=true
startretries=5
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

; One-shot: waits for dockerd to be ready, then runs /cbox/init.d/*.sh.
; `priority` is higher than dockerd so supervisord starts dockerd first;
; cbox-init itself blocks on `docker info` before invoking any scripts,
; so the ordering is enforced regardless of supervisord's start order.
; `autorestart=false` + `startsecs=0` + `exitcodes=0` make this a true
; one-shot: success = exit 0 and stay exited; failure = FATAL state
; surfaced in supervisorctl.
[program:cbox-init]
command=/usr/local/bin/cbox-init
autostart=true
autorestart=false
startsecs=0
startretries=0
exitcodes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
