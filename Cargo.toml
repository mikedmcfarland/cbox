[package]
name = "cbox"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Michael McFarland <mikedmcfarland@gmail.com>"]
license = "MIT"
description = "Run Claude Code sessions in isolated Docker containers"
repository = "https://github.com/mikedmcfarland/cbox"
readme = "README.md"
keywords = ["claude", "docker", "cli", "sandbox"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
bollard = "0.21"
bytes = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_bw = "2"
shellexpand = "3"
tar = "0.4"
tokio = { version = "1", features = ["macros", "rt", "process", "fs", "io-util"] }
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serial_test = "3.4.0"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
